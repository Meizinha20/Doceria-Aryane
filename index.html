<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Marine Doces Gourmet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Doceria da Aryane</h1>
  <p>Copo da Felicidade 🍰</p>
  <button class="btn-carrinho" onclick="abrirCarrinho()">🛒 Carrinho</button>
</header>

<section class="catalogo">

  <div class="card">
    <img src="imagens/copo1.jpg">
    <h2>Copo da Felicidade</h2>

    <label>Sabor</label>
    <select class="sabor">
      <option value="Morango">Morango</option>
      <option value="Uva">Chocolate</option>
      <option value="Kit-Kat">Ninho</option>
      <option value="Kit-Kat">Sonho de valsa</option>
      <option value="Kit-Kat">Ouro branco</option>
      <option value="Kit-Kat">Oreo</option>
      <option value="Kit-Kat">brownie</option>
    </select>

    <label>Tamanho</label>
    <select class="tamanho">
      <option value="150ml" data-preco="12">150ml – R$12</option>
      <option value="250ml" data-preco="18">250ml – R$18</option>
      <option value="300ml" data-preco="23">300ml – R$23</option>
    </select>

    <label class="check">
      <input type="checkbox" class="nutella"> Nutella (+R$5)
    </label>

    <button onclick="adicionar(this)">Adicionar</button>
  </div>

</section>

<div id="overlay" onclick="fecharCarrinho()"></div>

<div id="carrinho">
  <div class="topo">
    <h2>Seu Carrinho</h2>
    <button onclick="fecharCarrinho()">✖</button>
  </div>

  <ul id="lista"></ul>

  <div class="rodape">
    <p id="total"></p>
    <button class="whats" onclick="finalizar()">Finalizar no WhatsApp</button>
  </div>
</div>

<a class="insta" href="https://instagram.com/SEUINSTAGRAM" target="_blank">📸</a>

<script src="script.js"></script>
</body>
</html>
