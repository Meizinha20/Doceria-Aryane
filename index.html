<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doceria da Aryane 🍰</title>

  <!-- FONTES -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Doceria da Aryane</h1>
  <p>Copo da Felicidade • Pedidos online</p>

  <button class="btn-carrinho" onclick="abrirCarrinho()">
    🛒 <span id="contador">0</span>
  </button>
</header>

<main class="catalogo">

  <div class="card">
    <h2>Tradicional</h2>
    <p>Pequeno</p>
    <span>R$ 10,00</span>
    <button onclick="adicionar('Copo Tradicional', 15)">Adicionar</button>
  </div>

  <div class="card">
    <h2>Morango</h2>
    <p>Medio</p>
    <span>R$ 15,00</span>
    <button onclick="adicionar('Copo Morango', 18)">Adicionar</button>
  </div>

  <div class="card">
    <h2>Oreo</h2>
    <p>Grande</p>
    <span>R$ 20,00</span>
    <button onclick="adicionar('Copo Oreo', 20)">Adicionar</button>
  </div>

</main>

<!-- OVERLAY -->
<div id="overlay" onclick="fecharCarrinho()"></div>

<!-- CARRINHO -->
<aside id="carrinho">
  <div class="topo">
    <h2>Seu pedido</h2>
    <button onclick="fecharCarrinho()">✖</button>
  </div>

  <ul id="lista"></ul>

  <div class="rodape">
    <p>Total: R$ <span id="total">0</span></p>
    <button class="whats" onclick="finalizar()">Finalizar no WhatsApp</button>
  </div>
</aside>

<!-- INSTAGRAM -->
<a href="https://instagram.com/SEUINSTAGRAM" target="_blank" class="insta">📸</a>

<script src="script.js"></script>
</body>
</html>
