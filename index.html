<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doceria da Aryane 🍰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍬 Doceria da Aryane</h1>
  <p>Copo da Felicidade • Pedidos online</p>
  <button class="carrinho-btn" onclick="abrirCarrinho()">
    🛒 Carrinho (<span id="contador">0</span>)
  </button>
</header>

<main class="catalogo">

  <div class="produto">
    <h2>Tradicional</h2>
    <p>Chocolate + brigadeiro + creme</p>
    <span>R$ 15,00</span>
    <button onclick="adicionar('Copo Tradicional', 15)">
      Adicionar
    </button>
  </div>

  <div class="produto">
    <h2>Morango</h2>
    <p>Morango + leite ninho</p>
    <span>R$ 18,00</span>
    <button onclick="adicionar('Copo Morango', 18)">
      Adicionar
    </button>
  </div>

  <div class="produto">
    <h2>Oreo</h2>
    <p>Oreo + brigadeiro branco</p>
    <span>R$ 20,00</span>
    <button onclick="adicionar('Copo Oreo', 20)">
      Adicionar
    </button>
  </div>

</main>

<!-- CARRINHO -->
<div id="carrinho" class="carrinho">
  <div class="carrinho-conteudo">
    <h2>🛒 Seu pedido</h2>
    <ul id="lista"></ul>
    <p class="total">Total: R$ <span id="total">0</span></p>

    <button class="whats" onclick="finalizar()">
      Finalizar no WhatsApp
    </button>

    <button class="fechar" onclick="fecharCarrinho()">
      Fechar
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
